<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVIDEX — AI-Powered Evidence Intelligence & Integrity Platform</title>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans">
    <div id="root"></div>

    <!-- Smart Protocol Guard: Handles double-clicking index.html from File Explorer -->
    <script>
      (function() {
        if (window.location.protocol === 'file:') {
          // Check if local dev server is responding, or display the quick launcher screen
          fetch('http://localhost:5173', { mode: 'no-cors' })
            .then(function() {
              window.location.href = 'http://localhost:5173';
            })
            .catch(function() {
              var root = document.getElementById('root');
              if (root) {
                root.innerHTML = `
                  <div style="min-height: 100vh; background: #05070A; color: #F3F4F6; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                    <div style="max-width: 520px; width: 100%; background: #0B0F17; border: 1px solid #1E293B; border-radius: 16px; padding: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); text-align: center;">
                      <div style="width: 56px; height: 56px; border-radius: 12px; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                        <svg style="width: 28px; height: 28px; color: #22D3EE;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                      </div>
                      <h1 style="font-size: 24px; font-weight: 900; letter-spacing: 0.05em; color: #FFFFFF; margin: 0 0 4px 0;">EVIDEX</h1>
                      <p style="font-size: 11px; font-family: monospace; color: #22D3EE; text-transform: uppercase; letter-spacing: 0.15em; margin: 0 0 24px 0;">Evidence Intelligence Platform</p>
                      
                      <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 24px; text-align: left;">
                        <p style="margin: 0 0 8px 0; font-size: 13px; font-weight: 600; color: #38BDF8;">Direct File Access Detected (file://)</p>
                        <p style="margin: 0; font-size: 12px; color: #94A3B8; line-height: 1.5;">
                          Modern React applications require an active local server to run. To use EVIDEX, simply open the local web server link or double-click <strong>RUN_EVIDEX.bat</strong>.
                        </p>
                      </div>

                      <a href="http://localhost:5173" style="display: block; width: 100%; padding: 12px 0; background: #0891B2; color: #FFFFFF; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 13px; margin-bottom: 12px; box-shadow: 0 10px 15px -3px rgba(6, 182, 212, 0.2);">
                        Open App (http://localhost:5173)
                      </a>

                      <a href="./dist/index.html" style="display: block; width: 100%; padding: 12px 0; background: #1E293B; color: #E2E8F0; text-decoration: none; border: 1px solid #334155; border-radius: 8px; font-weight: 600; font-size: 12px;">
                        Open Standalone Offline Build (dist/index.html)
                      </a>

                      <p style="font-size: 11px; color: #64748B; margin: 20px 0 0 0; font-family: monospace;">
                        Status: Local Server Listening on Port 5173
                      </p>
                    </div>
                  </div>
                `;
              }
            });
        }
      })();
    </script>

    <!-- Vite module entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
